<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TI 2026 回放分析 · 选手档案</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8ece7; --muted: #a4aaa0; --line: #30352f;
      --panel: #171a16; --panel-2: #20241d;
      --accent: #9bcf53; --gold: #d4a845; --danger: #cf5f53;
      --radiant: #5bcf83; --dire: #cf6f53; --void: #0d0f0c;
      --v3: #7fb3d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background: linear-gradient(90deg, rgba(155,207,83,.08) 1px, transparent 1px),
                  linear-gradient(rgba(155,207,83,.06) 1px, transparent 1px), var(--void);
      background-size: 42px 42px;
      font-family: "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace;
    }
    .shell { width: min(1500px, calc(100vw - 32px)); margin: 0 auto; padding: 24px 0 40px; }
    header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; padding: 0 0 18px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: clamp(20px, 3.6vw, 38px); line-height: .95; font-weight: 800; }
    .meta { color: var(--muted); font-size: 13px; text-align: right; }
    .panel { border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--panel); border-radius: 8px; padding: 14px 16px; margin-top: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .num { font-variant-numeric: tabular-nums; }
    .hint { color: var(--muted); font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; border: 1px solid var(--line); }
    .ok { color: var(--accent); border-color: var(--accent); }
    .warn { color: var(--gold); border-color: var(--gold); }
    .err { color: var(--danger); border-color: var(--danger); }
    .role { display: inline-block; min-width: 22px; text-align: center; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); margin-right: 4px; }
    .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .solid-dot { display:inline-block; width:14px; height:14px; border-radius:50%; background: var(--accent); vertical-align: middle; margin-right:4px; }
    .dash-dot { display:inline-block; width:14px; height:14px; border-radius:50%; border: 2px dashed var(--v3); vertical-align: middle; margin-right:4px; }
    #status { color: var(--muted); }
    svg.radar { display:block; margin:0 auto; }
    .total-big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .suppressed { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <h1>选手 <span id="acct">…</span></h1>
    <div class="meta"><a href="index.html">← 语料库</a> &nbsp; <span id="status">载入中…</span></div>
  </header>
  <div id="content"><p class="hint">载入中…</p></div>
</div>
<script>
// esc escapes untrusted strings for safe HTML interpolation.
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// safeUrl accepts only http/https links; anything else renders as text "-".
function safeUrl(v) {
  const s = String(v || "");
  if (/^https?:\/\//i.test(s)) return s;
  return null;
}

// lineageLink renders one typed, match-qualified lineage ref as a deep link to
// the referenced evidence entity using the canonical ID/route contract.
//   - fact -> /matches/{m}/facts/{seq}            (stored id "fact:<seq>")
//   - episode -> /matches/{m}/episodes/{id}
//   - phase -> /matches/{m}/phases/{interval@S-E}
//   - metric_observation -> /matches/{m}/metrics/{metric}/{subject}
//   - algorithm -> /matches/{m}/algorithms/{evaluator}
//   - aggregation -> /aggregations/{id} (corpus-scoped, no match id needed)
//
// A ref without a match id (aggregation) still renders a navigable link; a
// malformed id renders an explicit unavailable marker instead of a misleading
// link.
function lineageLink(ref) {
  if (!ref || !ref.kind) return "-";
  const label = `${ref.kind}:${ref.id}`;
  let href = null;
  const kind = String(ref.kind);
  if (kind === "fact") {
    if (!ref.match_id) return `<span class="hint" title="缺少 match_id">不可用:${esc(label)}</span>`;
    href = `match.html?id=${encodeURIComponent(ref.match_id)}&evidence=fact:${encodeURIComponent(ref.id)}`;
  } else if (kind === "episode" || kind === "phase") {
    if (!ref.match_id) return `<span class="hint" title="缺少 match_id">不可用:${esc(label)}</span>`;
    href = `match.html?id=${encodeURIComponent(ref.match_id)}&evidence=${encodeURIComponent(kind)}:${encodeURIComponent(ref.id)}`;
  } else if (kind === "metric_observation") {
    if (!ref.match_id) return `<span class="hint" title="缺少 match_id">不可用:${esc(label)}</span>`;
    href = `match.html?id=${encodeURIComponent(ref.match_id)}&evidence=metric_observation:${encodeURIComponent(ref.id)}`;
  } else if (kind === "algorithm") {
    if (!ref.match_id) return `<span class="hint" title="缺少 match_id">不可用:${esc(label)}</span>`;
    href = `match.html?id=${encodeURIComponent(ref.match_id)}&evidence=algorithm:${encodeURIComponent(ref.id)}`;
  } else if (kind === "aggregation") {
    // Aggregation is corpus/scope-qualified; navigate to a dedicated view.
    href = `aggregation.html?id=${encodeURIComponent(ref.id)}`;
  }
  if (!href) return `<span class="hint">不可用:${esc(label)}</span>`;
  return `<a href="${href}" data-evidence-kind="${esc(kind)}" title="match ${esc(ref.match_id || "corpus")} · ${esc(ref.rule_version || "")}">${esc(label)}</a>`;
}

const AXES = ["laning","resources","tempo","map","vision","fight","objectives","endgame"];
const AXIS_ZH = { laning:"对线", resources:"资源", tempo:"节奏", map:"地图", vision:"视野", fight:"团战", objectives:"目标转化", endgame:"终局决策" };

function fmt(v) {
  if (v == null) return "-";
  return Math.round(v * 100) / 100;
}

// radarPoints builds the polygon path for an axes->value map.
function radarPoints(axes, values, cx, cy, r) {
  const n = axes.length;
  let pts = [];
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
    const raw = values == null ? 0 : values[axes[i]];
    const v = Math.max(0, Math.min(100, raw == null ? 0 : raw));
    const x = cx + r * (v / 100) * Math.cos(ang);
    const y = cy + r * (v / 100) * Math.sin(ang);
    pts.push(x + "," + y);
  }
  return pts.join(" ");
}

// renderRadar draws solid (official) and dashed (experimental) layers.
// axisLabels is optional; when null the canonical AXIS_ZH labels are used.
function renderRadar(official, experimental, axisLabels) {
  const cx = 160, cy = 160, r = 110;
  const n = AXES.length;
  let grid = "";
  for (let ring = 1; ring <= 4; ring++) {
    const ringR = r * ring / 4;
    let g = [];
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
      g.push((cx + ringR * Math.cos(ang)).toFixed(1) + "," + (cy + ringR * Math.sin(ang)).toFixed(1));
    }
    grid += `<polygon points="${g.join(" ")}" fill="none" stroke="#2a2f28" stroke-width="1"/>`;
  }
  let spokes = "";
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
    spokes += `<line x1="${cx}" y1="${cy}" x2="${(cx + r * Math.cos(ang)).toFixed(1)}" y2="${(cy + r * Math.sin(ang)).toFixed(1)}" stroke="#2a2f28" stroke-width="1"/>`;
    const lx = (cx + (r + 18) * Math.cos(ang)).toFixed(1);
    const ly = (cy + (r + 18) * Math.sin(ang)).toFixed(1);
    const anchor = Math.cos(ang) > 0 ? "start" : Math.cos(ang) < 0 ? "end" : "middle";
    const label = axisLabels && axisLabels[i] ? axisLabels[i] : (AXIS_ZH[AXES[i]] || AXES[i]);
    grid += `<text x="${lx}" y="${ly}" fill="#a4aaa0" font-size="10" text-anchor="${anchor}" dominant-baseline="middle">${esc(label)}</text>`;
  }
  let exp = "";
  if (experimental) {
    exp = `<polygon points="${radarPoints(AXES, experimental, cx, cy, r)}" fill="rgba(127,179,217,0.12)" stroke="#7fb3d9" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  }
  let off = "";
  if (official) {
    off = `<polygon points="${radarPoints(AXES, official, cx, cy, r)}" fill="rgba(155,207,83,0.16)" stroke="#9bcf53" stroke-width="2"/>`;
  }
  return `<svg class="radar" width="360" height="340" viewBox="0 0 360 340">
    <g transform="translate(20,10)">${grid}${spokes}${exp}${off}</g>
  </svg>`;
}

// scoreValues extracts published axis values from a scoring snapshot.
function scoreValues(ps, layer) {
  const src = layer === "experimental" ? ps.experimental_axes : ps.official_axes;
  const out = {};
  for (const a of AXES) {
    const ax = src && src[a];
    if (ax && ax.published && ax.value != null) out[a] = ax.value;
  }
  return Object.keys(out).length ? out : null;
}

// axisRows renders the per-axis decomposition table.
function axisRows(ps, layer) {
  const src = layer === "experimental" ? ps.experimental_axes : ps.official_axes;
  let rows = "";
  for (const a of AXES) {
    const ax = src && src[a];
    if (!ax) { rows += `<tr><td>${esc(AXIS_ZH[a] || a)}</td><td colspan="3" class="hint">无记录</td></tr>`; continue; }
    if (ax.published) {
      rows += `<tr><td>${esc(ax.display_name_zh || AXIS_ZH[a])}</td><td class="num">${fmt(ax.value)}</td><td colspan="2" class="hint">覆盖 ${ax.coverage.published_count}/${ax.coverage.metric_count} 指标</td></tr>`;
    } else {
      rows += `<tr><td>${esc(ax.display_name_zh || AXIS_ZH[a])}</td><td class="hint" colspan="3">已抑制：${esc(ax.reason || "")}</td></tr>`;
    }
  }
  return rows;
}

// metricDrilldown renders the score decomposition: raw values, percentiles,
// weights, coverage, and typed lineage (fact/episode/phase evidence refs) for
// every component.
function metricDrilldown(ps) {
  const seen = {};
  let rows = "";
  for (const a of AXES) {
    const ax = ps.official_axes && ps.official_axes[a];
    if (!ax || !ax.components) continue;
    for (const mid of Object.keys(ax.components)) {
      if (seen[mid]) continue;
      seen[mid] = true;
      const c = ax.components[mid];
      if (!c) continue;
      const raw = c.raw_value == null ? "-" : fmt(c.raw_value);
      const pct = c.percentile == null ? "-" : fmt(c.percentile);
      const st = c.published ? `<span class="badge ok">已发布</span>` : `<span class="badge warn">不可用</span>`;
      const reason = c.unavailable_reason ? ` · ${esc(c.unavailable_reason)}` : "";
      const agg = ps.aggregated_metrics && ps.aggregated_metrics[mid];
      let lineage = "-";
      if (agg && agg.lineage && agg.lineage.length) {
        lineage = agg.lineage.map(ref => lineageLink(ref)).join(" ");
      }
      rows += `<tr><td>${esc(mid)}</td><td class="num">${esc(raw)}</td><td class="num">${esc(pct)}</td><td class="num">${esc(c.weight)}</td><td>${st}${reason}</td><td class="hint">${lineage}</td></tr>`;
    }
  }
  return rows;
}

// aggregationDrilldown renders the player-tournament aggregation entities with
// their canonical aggregation links and retained child lineage refs. It
// renders even when no axis publishes, so the aggregation entity is always
// navigable.
function aggregationDrilldown(ps) {
  const agg = ps.aggregated_metrics || {};
  const mids = Object.keys(agg).sort();
  if (!mids.length) return `<p class="hint">无聚合指标</p>`;
  let rows = "";
  for (const mid of mids) {
    const am = agg[mid];
    const aggRefs = (am.lineage || []).filter(r => r.kind === "aggregation");
    const childCount = (am.lineage || []).filter(r => r.kind !== "aggregation").length;
    const links = aggRefs.map(r => lineageLink(r)).join(" ") || `<span class="hint">无聚合引用</span>`;
    rows += `<tr><td>${esc(mid)}</td><td class="num">${fmt(am.value)}</td><td class="num">${esc(am.eligible_matches)}</td><td class="hint">${esc(childCount)} 个底层引用</td><td>${links}</td></tr>`;
  }
  return `<table><thead><tr><th>指标</th><th>聚合值</th><th>合格比赛</th><th>子引用数</th><th>聚合实体链接</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// totalCard renders the official/experimental total with gates.
function totalCard(total) {
  if (!total) return `<p class="hint">无总分记录</p>`;
  if (!total.published) {
    const reasons = (total.reasons || []).map(r => `<li>${esc(r)}</li>`).join("");
    return `<div class="suppressed">总分已抑制（未达到发布闸门）<ul class="hint">${reasons || "<li>无发布轴</li>"}</ul></div>`;
  }
  const axes = (total.axes_included || []).map(a => `<span class="badge">${esc(AXIS_ZH[a] || a)}</span>`).join(" ");
  return `<div>
    <div class="total-big">${fmt(total.value)}</div>
    <div class="hint">轴权重 ${axes}</div>
  </div>`;
}

async function load() {
  const acct = new URLSearchParams(location.search).get("id");
  document.getElementById("acct").textContent = acct || "?";
  try {
    const resp = await fetch(`/api/replay/v1/players/${acct}`);
    const env = await resp.json();
    const data = env.data || {};
    const c = document.getElementById("content");
    c.innerHTML = "";
    const matches = data.matches || [];
    const ps = data.score;
    document.getElementById("status").textContent = `${matches.length} 场比赛`;

    let header = `<div class="panel"><h3 style="margin-top:0">选手概览</h3><table>`;
    if (matches[0]) {
      const m0 = matches[0];
      header += `<tr><th>账户</th><td>${esc(m0.account_id || acct)}</td></tr>
        <tr><th>名义角色</th><td><span class="role">${esc(m0.nominal_role || "-")}</span>${esc(m0.role_source || "")}</td></tr>
        <tr><th>角色来源</th><td>${esc(m0.role_source || "-")} ${m0.role_source_url ? `<a href="${esc(safeUrl(m0.role_source_url))}" target="_blank" rel="noopener">来源</a>` : ""}</td></tr>`;
    }
    if (ps && ps.subject_coverage) {
      const cov = ps.subject_coverage;
      header += `<tr><th>有效比赛数</th><td class="num">${esc(cov.eligible_matches)}</td></tr>
        <tr><th>已发布指标数</th><td class="num">${esc(cov.published_metrics)}</td></tr>
        <tr><th>语料比赛数</th><td class="num">${esc(cov.corpus_matches)}</td></tr>`;
    }
    header += `</table></div>`;
    c.insertAdjacentHTML("beforeend", header);

    if (ps) {
      c.insertAdjacentHTML("beforeend", `
        <div class="panel">
          <h3 style="margin-top:0">八轴雷达（选手锦标赛聚合）</h3>
          <div class="grid">
            <div class="panel">
              ${renderRadar(scoreValues(ps, "official"), scoreValues(ps, "experimental"), null)}
              <div class="legend">
                <span><span class="solid-dot"></span>官方实线（V1/V2）</span>
                <span><span class="dash-dot"></span>实验虚线（V3）</span>
              </div>
            </div>
            <div class="panel">
              <h4 style="margin-top:0">官方总分</h4>
              ${totalCard(ps.official_total)}
              <h4 style="margin-top:12px">实验总分（V3）</h4>
              ${totalCard(ps.experimental_total)}
              <p class="hint">同角色语料：选手有效 ${esc(ps.subject_coverage.eligible_matches)} 场 · 语料 ${esc(ps.subject_coverage.corpus_matches)} 场 · ${esc(ps.comparison_population || "")}</p>
            </div>
          </div>
          <h4 style="margin-top:12px">官方轴分解</h4>
          <table><thead><tr><th>轴</th><th>值</th><th>状态</th><th>说明</th></tr></thead><tbody>${axisRows(ps, "official")}</tbody></table>
          <h4 style="margin-top:12px">实验轴分解（虚线 V3）</h4>
          <table><thead><tr><th>轴</th><th>值</th><th>状态</th><th>说明</th></tr></thead><tbody>${axisRows(ps, "experimental")}</tbody></table>
          <h4 style="margin-top:12px">指标分解（原始值 · 同角色百分位 · 权重 · 覆盖 · 证据链）</h4>
          <table><thead><tr><th>指标</th><th>原始值</th><th>百分位</th><th>权重</th><th>发布</th><th>证据链</th></tr></thead><tbody>${metricDrilldown(ps)}</tbody></table>
          <h4 style="margin-top:12px">聚合实体（选手锦标赛聚合，含底层证据链）</h4>
          ${aggregationDrilldown(ps)}
        </div>`);
    } else {
      c.insertAdjacentHTML("beforeend", `<div class="panel"><p class="hint">该账户尚无评分快照（语料中无已发布比赛）。</p></div>`);
    }

    if (matches.length) {
      let mrows = "";
      for (const m of matches) {
        const mm = m.match_metrics || {};
        const kvs = Object.keys(mm).map(k => `${esc(k)}=${fmt(mm[k].value)}`).join(" · ");
        mrows += `<tr>
          <td><a href="match.html?id=${esc(m.match_id)}">${esc(m.match_id)}</a></td>
          <td>${esc(m.hero || "-")}</td>
          <td><span class="role">${esc(m.nominal_role || "-")}</span></td>
          <td class="hint">${kvs || "无比赛级指标"}</td>
        </tr>`;
      }
      c.insertAdjacentHTML("beforeend", `
        <div class="panel"><h3 style="margin-top:0">逐场明细（原始指标值）</h3>
        <table><thead><tr><th>比赛</th><th>英雄</th><th>角色</th><th>指标</th></tr></thead><tbody>${mrows}</tbody></table></div>`);
    }
  } catch (e) {
    document.getElementById("status").textContent = "加载失败: " + e;
  }
}
load();
</script>
</body>
</html>
