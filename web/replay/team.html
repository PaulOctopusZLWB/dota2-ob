<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TI 2026 回放分析 · 队伍档案</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8ece7; --muted: #a4aaa0; --line: #30352f;
      --panel: #171a16; --panel-2: #20241d;
      --accent: #9bcf53; --gold: #d4a845; --danger: #cf5f53;
      --radiant: #5bcf83; --dire: #cf6f53; --void: #0d0f0c;
      --exp: #7fb3d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background: linear-gradient(90deg, rgba(155,207,83,.08) 1px, transparent 1px),
                  linear-gradient(rgba(155,207,83,.06) 1px, transparent 1px), var(--void);
      background-size: 42px 42px;
      font-family: "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace;
    }
    .shell { width: min(1500px, calc(100vw - 32px)); margin: 0 auto; padding: 24px 0 40px; }
    header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; padding: 0 0 18px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: clamp(20px, 3.6vw, 38px); line-height: .95; font-weight: 800; }
    h3 { margin: 0 0 10px; }
    .meta { color: var(--muted); font-size: 13px; text-align: right; }
    .panel { border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--panel); border-radius: 8px; padding: 14px 16px; margin-top: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .num { font-variant-numeric: tabular-nums; }
    .hint { color: var(--muted); font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; border: 1px solid var(--line); }
    .ok { color: var(--accent); border-color: var(--accent); }
    .warn { color: var(--gold); border-color: var(--gold); }
    .exp { color: var(--exp); border-color: var(--exp); }
    .suppressed { color: var(--gold); }
    svg.radar { display:block; margin:0 auto; }
    .role { display: inline-block; min-width: 22px; text-align: center; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); margin-right: 4px; }
    #status { color: var(--muted); }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <h1>队伍 <span id="team">…</span></h1>
    <div class="meta"><a href="index.html">← 语料库</a> &nbsp; <span id="status">载入中…</span></div>
  </header>
  <div id="content"><p class="hint">载入中…</p></div>
</div>
<script>
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function fmt(v) {
  if (v == null) return "-";
  return Math.round(v * 100) / 100;
}
function safeUrl(v) {
  const s = String(v || "");
  if (/^https?:\/\//i.test(s)) return s;
  return null;
}

const AXES = ["laning","resources","tempo","map","vision","fight","objectives","endgame"];
const AXIS_ZH = { laning:"对线", resources:"资源", tempo:"节奏", map:"地图", vision:"视野", fight:"团战", objectives:"目标转化", endgame:"终局决策" };

// radarPoints builds the polygon path for an axes->value map.
function radarPoints(axes, values, cx, cy, r) {
  const n = axes.length;
  let pts = [];
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
    const raw = values == null ? 0 : values[axes[i]];
    const v = Math.max(0, Math.min(100, raw == null ? 0 : raw));
    const x = cx + r * (v / 100) * Math.cos(ang);
    const y = cy + r * (v / 100) * Math.sin(ang);
    pts.push(x.toFixed(1) + "," + y.toFixed(1));
  }
  return pts.join(" ");
}

// renderTeamRadar draws the solid official layer and the dashed experimental
// layer. A suppressed layer is never drawn as a zero polygon; it is reported
// separately in the suppression list.
function renderTeamRadar(ts) {
  const cx = 160, cy = 160, r = 110;
  const n = AXES.length;
  let grid = "";
  for (let ring = 1; ring <= 4; ring++) {
    const ringR = r * ring / 4;
    let g = [];
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
      g.push((cx + ringR * Math.cos(ang)).toFixed(1) + "," + (cy + ringR * Math.sin(ang)).toFixed(1));
    }
    grid += `<polygon points="${g.join(" ")}" fill="none" stroke="#2a2f28" stroke-width="1"/>`;
  }
  let spokes = "";
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
    spokes += `<line x1="${cx}" y1="${cy}" x2="${(cx + r * Math.cos(ang)).toFixed(1)}" y2="${(cy + r * Math.sin(ang)).toFixed(1)}" stroke="#2a2f28" stroke-width="1"/>`;
    const lx = (cx + (r + 18) * Math.cos(ang)).toFixed(1);
    const ly = (cy + (r + 18) * Math.sin(ang)).toFixed(1);
    const anchor = Math.cos(ang) > 0 ? "start" : Math.cos(ang) < 0 ? "end" : "middle";
    spokes += `<text x="${lx}" y="${ly}" fill="#a4aaa0" font-size="10" text-anchor="${anchor}" dominant-baseline="middle">${esc(AXIS_ZH[AXES[i]] || AXES[i])}</text>`;
  }
  // Official solid layer.
  const officialVals = {};
  for (const a of AXES) {
    const ax = ts.official_axes && ts.official_axes[a];
    if (ax && ax.published && ax.value != null) officialVals[a] = ax.value;
  }
  let off = "";
  if (Object.keys(officialVals).length > 0) {
    off = `<polygon points="${radarPoints(AXES, officialVals, cx, cy, r)}" fill="rgba(155,207,83,0.16)" stroke="#9bcf53" stroke-width="2"/>`;
  }
  // Experimental dashed layer (suppressed -> no polygon, reported separately).
  const expVals = {};
  for (const a of AXES) {
    const ax = ts.experimental_axes && ts.experimental_axes[a];
    if (ax && ax.published && ax.value != null) expVals[a] = ax.value;
  }
  let exp = "";
  if (Object.keys(expVals).length > 0) {
    exp = `<polygon points="${radarPoints(AXES, expVals, cx, cy, r)}" fill="rgba(127,179,217,0.12)" stroke="#7fb3d9" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  }
  return `<svg class="radar" width="360" height="340" viewBox="0 0 360 340">
    <g transform="translate(20,10)">${grid}${spokes}${exp}${off}</g>
  </svg>`;
}

// teamAxisRows renders the per-axis decomposition (solid official layer).
function teamAxisRows(ts, layer) {
  const src = layer === "experimental" ? ts.experimental_axes : ts.official_axes;
  let rows = "";
  for (const a of AXES) {
    const ax = src && src[a];
    if (!ax) { rows += `<tr><td>${esc(AXIS_ZH[a] || a)}</td><td colspan="4" class="hint">无记录</td></tr>`; continue; }
    if (ax.published) {
      rows += `<tr><td>${esc(ax.display_name_zh || AXIS_ZH[a])}</td><td class="num">${fmt(ax.value)}</td><td class="hint">覆盖 ${ax.coverage.published_count}/${ax.coverage.metric_count} 指标</td><td class="hint">${esc(ax.reason || "")}</td><td class="hint">${esc(ax.coverage.opportunity_count || "")}</td></tr>`;
    } else {
      rows += `<tr><td>${esc(ax.display_name_zh || AXIS_ZH[a])}</td><td class="hint" colspan="4">已抑制：${esc(ax.reason || "")}</td></tr>`;
    }
  }
  return rows;
}

// teamComponentDrilldown renders the exact component decomposition that
// reproduces each displayed axis value: metric, raw pooled value, percentile,
// weight, opportunity/denominator, eligible matches, and suppression reason.
function teamComponentDrilldown(ts) {
  let rows = "";
  for (const a of AXES) {
    const ax = ts.official_axes && ts.official_axes[a];
    if (!ax || !ax.components) continue;
    for (const mid of Object.keys(ax.components)) {
      const c = ax.components[mid];
      if (!c) continue;
      const raw = c.raw_value == null ? "-" : fmt(c.raw_value);
      const pct = c.percentile == null ? "-" : fmt(c.percentile);
      const agg = ts.metric_percentiles && ts.metric_percentiles[mid];
      const st = c.published ? `<span class="badge ok">已发布</span>` : `<span class="badge warn">不可用</span>`;
      const reason = c.unavailable_reason ? ` · ${esc(c.unavailable_reason)}` : "";
      const opp = agg ? `机会 ${esc(agg.cohort_size)}` : "";
      rows += `<tr data-team-score-metric="${esc(mid)}" data-metric-version="${esc(c.metric_version || (agg && agg.metric_version) || "-")}"><td>${esc(a)}</td><td>${esc(mid)}</td><td>${esc(c.metric_version || (agg && agg.metric_version) || "-")}</td><td class="num">${esc(raw)}</td><td class="num">${esc(pct)}</td><td class="num">${esc(c.weight)}</td><td class="hint">${opp}</td><td>${st}${reason}</td></tr>`;
    }
  }
  return rows;
}

// totalCard renders one named total with gate reasons.
function totalCard(total) {
  if (!total) return `<p class="hint">无总分记录</p>`;
  if (!total.published) {
    const reasons = (total.reasons || []).map(r => `<li>${esc(r)}</li>`).join("");
    return `<div class="suppressed">总分已抑制（未达到发布闸门）<ul class="hint">${reasons || "<li>无发布轴</li>"}</ul></div>`;
  }
  const axes = (total.axes_included || []).map(a => `<span class="badge">${esc(AXIS_ZH[a] || a)}</span>`).join(" ");
  return `<p class="num" style="font-size:32px;font-weight:800">${fmt(total.value)}</p>
    <p class="hint">${esc(total.name)} · 纳入轴 ${axes || "无"}</p>
    <p class="hint">覆盖 ${total.coverage.published_count}/${total.coverage.metric_count} 轴</p>`;
}

async function load() {
  const teamId = new URLSearchParams(location.search).get("id");
  document.getElementById("team").textContent = teamId || "?";
  try {
    const resp = await fetch(`/api/replay/v1/teams/${teamId}`);
    const env = await resp.json();
    const data = env.data || {};
    const c = document.getElementById("content");
    c.innerHTML = "";
    const matches = data.matches || [];
    document.getElementById("status").textContent = `${matches.length} 场队伍比赛`;

    const ts = data.team_score || {};
    let s = `<div class="panel"><h3 style="margin-top:0">队伍评分 · 官方层（实线）与实验层（虚线）</h3>`;
    s += `<div class="grid"><div>${renderTeamRadar(ts)}</div><div>`;
    // Official total.
    s += `<h3 style="margin-top:0">队伍官方总分</h3>${totalCard(ts.official_total)}`;
    // Experimental total.
    s += `<h3 style="margin-top:0">队伍实验总分（V3 虚线层）</h3>${totalCard(ts.experimental_total)}`;
    s += `<p class="hint">有效比赛 ${esc(ts.subject_coverage ? ts.subject_coverage.eligible_matches : "-")} 场 · 语料 ${esc(ts.subject_coverage ? ts.subject_coverage.corpus_matches : "-")} 场 · 版本 ${esc(ts.scoring_version || "-")}</p>`;
    s += `</div></div>`;
    // Official axis table.
    s += `<h3 style="margin-top:14px">官方轴分解</h3><table><thead><tr><th>轴</th><th>值</th><th>覆盖</th><th>说明</th><th>机会</th></tr></thead><tbody>${teamAxisRows(ts, "official")}</tbody></table>`;
    // Experimental axis table (always visible, suppressed as suppressed).
    s += `<h3 style="margin-top:14px">实验轴分解（虚线层）</h3><table><thead><tr><th>轴</th><th>值</th><th>覆盖</th><th>说明</th><th>机会</th></tr></thead><tbody>${teamAxisRows(ts, "experimental")}</tbody></table>`;
    // Exact component decomposition.
    s += `<h3 style="margin-top:14px">指标分解（可复现显示值）</h3><table><thead><tr><th>轴</th><th>指标</th><th>指标版本</th><th>原始值</th><th>百分位</th><th>权重</th><th>机会/样本</th><th>状态</th></tr></thead><tbody>${teamComponentDrilldown(ts) || `<tr><td colspan="8" class="hint">无</td></tr>`}</tbody></table>`;
    s += `</div>`;
    c.insertAdjacentHTML("beforeend", s);

    for (const m of matches) {
      let players = "";
      for (const p of (m.players || [])) {
        const metrics = Object.keys(p.metrics || {}).map(k => `${esc(k)}=${Math.round(p.metrics[k].value * 100) / 100}`).join(" · ");
        players += `<tr>
          <td><a href="player.html?id=${esc(p.account_id)}">${esc(p.account_id)}</a></td>
          <td><span class="role">${esc(p.nominal_role || "-")}</span></td>
          <td class="hint">${esc(metrics)}</td>
        </tr>`;
      }
      c.insertAdjacentHTML("beforeend", `
        <div class="panel">
          <h3 style="margin-top:0"><a href="match.html?id=${esc(m.match_id)}">比赛 ${esc(m.match_id)}</a>
            <span class="hint">${esc(m.side || "")} · ${esc(m.status || "")}</span></h3>
          <table><thead><tr><th>选手</th><th>角色</th><th>指标</th></tr></thead><tbody>${players || `<tr><td colspan="3" class="hint">无评分快照</td></tr>`}</tbody></table>
        </div>`);
    }
    if (matches.length === 0) {
      c.insertAdjacentHTML("beforeend", `<div class="panel"><p class="hint">该队伍没有已发布比赛记录。</p></div>`);
    }
  } catch (e) {
    document.getElementById("status").textContent = "加载失败: " + e;
  }
}
load();
</script>
</body>
</html>
